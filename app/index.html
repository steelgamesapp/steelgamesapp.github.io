/* Layout: app shell. Sticky top bar with the brand, one scrolling screen per tab, and a tab bar pinned under the top bar (Deals, News, Gear, Account). Game and product pages slide in as their own screens with a Back button. */
:root {
  --bg: #0C0E11; --surface: #15181D; --raised: #1C2027; --line: #262C35; --line-strong: #2E3540;
  --fg: #EDEFF2; --muted: #9BA4AF; --steel: #C3CBD5;
  --accent: #FF7A1A; --accent-soft: #FF9A4D; --accent-ink: #1A0E04;
  --good: #5CCB72; --good-bg: #0F1D14; --good-line: #244A30;
  --warn: #F5B544; --warn-bg: #221A0B; --warn-line: #5A4416;
  --bad: #FF6B74; --bad-bg: #231114; --bad-line: #5A262C;
  --info: #8FB4E3; --info-bg: #121A26; --info-line: #2B3D57;
  --resale: #C4B5FD;
  --display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --body: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --tabbar: 48px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.5; }
body { min-height: 100dvh; }
a { color: var(--accent-soft); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left, 0px)) 0 max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.topbar { position: sticky; top: 0; z-index: 20; background: rgba(12,14,17,0.94); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
@supports (backdrop-filter: blur(8px)) { .topbar { background: rgba(12,14,17,0.82); backdrop-filter: blur(10px); } }
.topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--fg); }
.brand span { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: 2.4px; }
.vet { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 7px; border-radius: 999px; background: var(--info-bg); border: 1px solid var(--info-line); color: #CFE0F5; font-size: 13px; font-weight: 600; white-space: nowrap; }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px 0 6px; border: 0; border-radius: 10px; background: none; color: var(--accent-soft); font-weight: 600; cursor: pointer; }

/* Tab bar */
.tabbar { border-top: 1px solid var(--line); }
.tabbar nav { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar); }
.tabbar a { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 7px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600; border-bottom: 2px solid transparent; }
.tabbar a svg { width: 20px; height: 20px; }
.tabbar a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }

/* Screens */
main { padding: 16px 0 28px; }
main:focus { outline: none; }
.screen-title { font-size: 28px; font-weight: 700; margin: 6px 0 4px; }
.lede { color: var(--steel); font-size: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.section { margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }
.section h2 { font-size: 20px; }
.hint { color: var(--muted); font-size: 14px; }

/* Search and chips */
.search { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-strong); margin-top: 14px; }
.search input { flex: 1; min-width: 0; height: 50px; border: 0; background: none; color: var(--fg); font: inherit; font-size: 17px; outline: none; }
.search input::placeholder { color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; margin-top: 12px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--steel); font-size: 15px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* Deal rows */
.deal { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--fg); min-height: 76px; }
.deal:active { background: var(--raised); }
.thumb { width: 96px; height: 45px; flex-shrink: 0; border-radius: 8px; object-fit: cover; background: var(--raised); }
.deal-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.deal-title { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deal-meta { font-size: 13px; color: var(--muted); }
.price { font-weight: 700; font-variant-numeric: tabular-nums; }
.was { color: var(--muted); text-decoration: line-through; font-size: 13px; margin-left: 6px; font-weight: 400; }
.off { flex-shrink: 0; padding: 5px 8px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Cards */
.card { padding: 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-size: 19px; }
.card p { color: var(--steel); font-size: 16px; }
[hidden] { display: none !important; }
.verdict { border-width: 2px; }
.verdict .label { font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.v-good { background: var(--good-bg); border-color: var(--good-line); } .v-good .label, .v-good h3 { color: var(--good); }
.v-warn { background: var(--warn-bg); border-color: var(--warn-line); } .v-warn .label, .v-warn h3 { color: var(--warn); }
.v-bad { background: var(--bad-bg); border-color: var(--bad-line); } .v-bad .label, .v-bad h3 { color: var(--bad); }
.v-info { background: var(--info-bg); border-color: var(--info-line); } .v-info .label, .v-info h3 { color: var(--info); }
.card ul { margin: 0; padding-left: 20px; color: var(--steel); font-size: 15px; display: flex; flex-direction: column; gap: 4px; }

/* Game header */
.hero-img { width: 100%; aspect-ratio: 460 / 215; object-fit: cover; border-radius: 16px; background: var(--raised); display: block; }
.game-title { font-size: 26px; margin-top: 14px; }
.big-price { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.big-price .price { font-family: var(--display); font-size: 32px; }

/* Store rows */
.store { display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.store.best { border: 2px solid var(--accent); }
.store-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.store-name { font-weight: 700; }
.earn { font-size: 13px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent; font-weight: 700; font-size: 16px; text-decoration: none; cursor: pointer; white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: var(--raised); color: var(--fg); border-color: var(--line-strong); }
.btn-danger { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-line); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: 0.5; cursor: default; }

/* News */
.news-item { display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--fg); }
.news-item h3 { font-family: var(--body); font-size: 17px; font-weight: 600; line-height: 1.35; }
.tag-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.plat { padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; border: 1px solid; }
.p-pc { color: #FF8A3D; background: #1E150E; border-color: #4A2E16; }
.p-xbox { color: #5CCB72; background: #0F1D14; border-color: #244A30; }
.p-playstation { color: #6FA0FF; background: #0E1526; border-color: #243C68; }
.p-nintendo { color: #FF6B74; background: #231114; border-color: #5A262C; }
.p-all { color: var(--steel); background: var(--raised); border-color: var(--line-strong); }

/* Gear */
.cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cat { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 64px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-weight: 600; font-size: 16px; }
.cat small { color: var(--muted); font-weight: 500; font-size: 13px; }
.product { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.product h3 { font-family: var(--body); font-size: 17px; font-weight: 700; }
.product p { color: var(--steel); font-size: 15px; }

/* Forms */
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600; color: var(--steel); }
.input, select.input { min-height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); font: inherit; font-size: 17px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; color: var(--steel); }
.check input { width: 24px; height: 24px; margin-top: 2px; accent-color: var(--accent); flex-shrink: 0; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.seg button { min-height: 44px; border: 0; border-radius: 10px; background: none; font-weight: 600; color: var(--steel); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--fg); }
.list-link { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 16px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; font-weight: 500; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; cursor: pointer; }
.list-link:last-child { border-bottom: 0; }
.list { border-radius: 16px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.list-link span:last-child { color: var(--muted); }
.msg { padding: 12px 14px; border-radius: 12px; font-size: 15px; }
.msg.err { background: var(--bad-bg); border: 1px solid var(--bad-line); color: #FFC2C6; }
.msg.ok { background: var(--good-bg); border: 1px solid var(--good-line); color: #BDEBC7; }
.foot { margin-top: 28px; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 8px; }

/* Loading */
.skel { height: 76px; border-radius: 16px; background: linear-gradient(90deg, var(--surface), var(--raised), var(--surface)); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

const cache = new Map();
async function getJSON(url, opts = {}, ttl = 15 * 60_000) {
  const hit = cache.get(url);

  const r = await fetch(url, opts);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.json();
  cache.set(url, { at: Date.now(), data });

}

}

let gpus = null;
async function getGPUs() {
  if (gpus) return gpus;
  try { gpus = (await getJSON('hardware.json', {}, 24 * 3600_000)).gpus; } catch { gpus = []; }
  return gpus;

const myPC = () => store.get('myPC', { gpu: null, ram: 16, storage: 200 });
function normalizeHW(t) {
  t = t.toLowerCase();
  for (const w of ['nvidia','geforce','amd','radeon','intel','™','®','(r)','(tm)']) t = t.split(w).join(' ');
  return t.replace(/rx vega/g, 'vega').replace(/-/g, ' ');
}
function gpusIn(text, list) {
  let rest = normalizeHW(text); const found = [];
  for (const g of [...list].sort((a, b) => b.key.length - a.key.length)) {
    const re = new RegExp('(?<![a-z0-9])' + g.key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s*') + '(?![a-z0-9])');
    if (re.test(rest)) { found.push(g); rest = rest.replace(re, ' '); }
  }
  return found;
}
function needs(text, list) {
  const n = { gpus: gpusIn(text || '', list), ram: null, storage: null };
  const lower = (text || '').toLowerCase();
  let m = lower.match(/memory:\s*(\d+(?:\.\d+)?)\s*(gb|mb)/);
  if (m) n.ram = m[2] === 'mb' ? Math.max(1, Math.floor(m[1] / 1024)) : Math.ceil(+m[1]);
  m = lower.match(/(?:storage|hard drive|hard disk|disk space)[^\d\n]*(\d+(?:\.\d+)?)\s*(gb|mb|tb)/);
  if (m) n.storage = m[2] === 'mb' ? Math.max(1, Math.floor(m[1] / 1024)) : m[2] === 'tb' ? Math.round(m[1] * 1024) : Math.ceil(+m[1]);
  n.gpuScore = n.gpus.length ? Math.min(...n.gpus.map((g) => g.score)) : null;
  return n;
}
function runVerdict(info, list) {
  if (!info || (!info.minimum && !info.recommended)) return { level: 'info', headline: 'No system requirements listed', details: ["This game's store page doesn't list PC requirements."], upgrades: [] };
  const pc = myPC(); const gpu = list.find((g) => g.key === pc.gpu);
  if (!gpu) return { level: 'info', headline: 'Add your PC to check', details: ['Tell us your graphics card and memory once, and every game will check it.'], upgrades: [], needsPC: true };
  const min = needs(info.minimum, list), rec = needs(info.recommended, list);
  const details = [], upgrades = [];
  const meets = (n) => { let known = false, ok = true; if (n.gpuScore != null) { known = true; ok = ok && gpu.score >= n.gpuScore; } if (n.ram != null) { known = true; ok = ok && pc.ram >= n.ram; } return known ? ok : null; };
  const mRec = meets(rec), mMin = meets(min);
  if (min.gpuScore != null && gpu.score < min.gpuScore) { details.push(`Graphics: needs at least ${min.gpus.map((g) => g.name).join(' or ')}. You have ${gpu.name}.`); upgrades.push('Graphics cards'); }
  if (min.ram != null && pc.ram < min.ram) { details.push(`Memory: needs ${min.ram} GB. You have ${pc.ram} GB.`); upgrades.push('Memory'); }
  const space = rec.storage ?? min.storage;
  if (space != null && pc.storage < space) { details.push(`Storage: needs ${space} GB free. You have ${pc.storage} GB.`); upgrades.push('Storage'); }
  if (!min.gpus.length && !rec.gpus.length) details.push("We couldn't match the graphics card this game lists, so only memory was checked.");
  details.push("Processor isn't checked. Compare it with the requirements below.");
  let level, headline;
  if (mRec === true && !upgrades.includes('Storage')) { level = 'good'; headline = 'Runs great on your PC'; }
  else if (mMin === true || (mMin == null && mRec === true)) {
    level = 'good'; headline = upgrades.length ? 'Should run, but check storage' : 'Should run on your PC';
    if (rec.gpuScore != null && gpu.score < rec.gpuScore && !upgrades.includes('Graphics cards')) { details.unshift('Expect lower settings. Your graphics card is below the recommended one.'); upgrades.push('Graphics cards'); level = 'warn'; }
  } else if (mMin === false) { level = 'bad'; headline = "Below this game's minimum"; }
  else { level = 'info'; headline = "Can't tell from this listing"; }
  return { level, headline, details, upgrades };
}
function buyOrWait(current, regular, low) {
  const off = pct(current, regular);
  if (!(low > 0)) return off >= 50 ? { level: 'good', label: 'Good deal', detail: `${off}% off right now. We don't have its price history yet.` }
                                   : { level: 'warn', label: 'Consider waiting', detail: "We don't have its price history yet. Add it to your watchlist so you can check back." };
  if (current <= low * 1.05) return { level: 'good', label: 'Buy now', detail: current <= low ? "This is the lowest price it's ever been." : `Within 5% of its lowest price ever (${money(low)}).` };
  if (off >= 40 && current <= low * 1.35) return { level: 'good', label: 'Good deal', detail: `${off}% off. It has been ${money(low)} before, so waiting could save ${money(current - low)}.` };
  return { level: 'warn', label: 'Wait for a better price', detail: `It has been as low as ${money(low)}. Add it to your watchlist and check back.` };
}

function priceMeter(cur, low, reg, ts) {
  if (!(low > 0) || !(reg > low)) return '';
  const pos = Math.max(0, Math.min(100, Math.round((cur - low) / (reg - low) * 100)));
  const when = ts ? new Date(+ts * 1000).toLocaleDateString(undefined, { month: 'short', year: 'numeric' }) : '';
  const tone = cur <= low * 1.05 ? 'good' : pos <= 40 ? 'mid' : 'low';
  return `<div class="meter-card"><div class="meter-head"><strong>Price history</strong><span class="hint">${cur <= low ? 'At its lowest ever' : money(cur - low) + ' above its lowest'}</span></div>
    <div class="meter" role="img" aria-label="Current price ${money(cur)}, lowest ever ${money(low)}, regular ${money(reg)}"><span class="meter-dot m-${tone}" style="left:${pos}%"></span></div>
    <div class="meter-scale"><span>${money(low)}<small>Lowest ever${when ? ' · ' + when : ''}</small></span><span>${money(reg)}<small>Regular price</small></span></div></div>`;
}

async function loadDeals() {
  const box = document.getElementById('results'); if (!box) return;
  box.innerHTML = `<div class="stack">${skeletons(6)}</div>`;
  const names = await getStoreNames();
  try {
    if (state.q) {
      const games = await getJSON(CS + 'games?limit=30&title=' + encodeURIComponent(state.q));
      box.innerHTML = `<h2>Results for "${esc(state.q)}"</h2>` + (games.length ? `<div class="stack">${games.map((g) => `
        <a class="deal" href="#/game/${encodeURIComponent(g.gameID)}"><img class="thumb" src="${esc(g.thumb)}" alt="" loading="lazy">
        <span class="deal-info"><span class="deal-title">${esc(g.external)}</span><span class="deal-meta">Lowest price right now</span>
        <span class="price">${money(g.cheapest)}</span></span></a>`).join('')}</div>` : '<p class="empty">No games found. Check the spelling, or try fewer words.</p>');
      return;
    }
    const ids = state.store === 'all' ? STORES.map((s) => s[0]).join(',') : state.store;
    const f = state.filter;
    const extra = f === 'free' ? '&upperPrice=0' : /^\d+(\.\d+)?$/.test(f) ? `&upperPrice=${f}&lowerPrice=0.01` : f === 'great' ? '&steamRating=80' : '';
    const url = `${CS}deals?storeID=${ids}&onSale=1&sortBy=${encodeURIComponent(state.sort)}&desc=${state.sort === 'Price' ? 0 : 1}&pageSize=40&pageNumber=${state.page}&AAA=0${extra}`;
    const deals = await getJSON(url);
    const seen = new Set(); const unique = deals.filter((d) => !seen.has(d.gameID) && seen.add(d.gameID));
    const lead = !state.page && state.sort === 'Deal Rating' && !f && unique.length > 3 ? unique.shift() : null;
    const rows = unique.map((d, i) => dealRow(d, names) + (i === 7 ? adSlot() : ''));
    const title = f === 'free' ? 'Free right now' : /^\d+(\.\d+)?$/.test(f) ? `Best deals under $${f}` : (SORTS.find((x) => x[0] === state.sort) || [])[1] || 'Deals';
    box.innerHTML = (await sponsorCard()) + (lead ? topPick(lead, names) : '') + `<h2>${esc(title)}</h2>` +
      (unique.length || lead ? `<div class="stack deal-grid">${rows.join('')}</div>${deals.length >= 40 ? '<button class="btn btn-ghost btn-block" id="more">Show more deals</button>' : ''}` : '<p class="empty">Nothing matches those filters right now. Try Any price, or another store.</p>');
    const more = document.getElementById('more');
    if (more) more.addEventListener('click', async () => {
      more.disabled = true; more.textContent = 'Loading…';
      try {
        state.page += 1;
        const next = await getJSON(url.replace(/pageNumber=\d+/, 'pageNumber=' + state.page));
        const have = new Set([...box.querySelectorAll('a.deal')].map((a) => decodeURIComponent(a.getAttribute('href').split('/').pop())));
        const add = next.filter((d) => !have.has(d.gameID));
        box.querySelector('.deal-grid').insertAdjacentHTML('beforeend', add.map((d) => dealRow(d, names)).join(''));
        if (next.length >= 40) { more.disabled = false; more.textContent = 'Show more deals'; } else more.remove();
      } catch { more.disabled = false; more.textContent = 'Try again'; }
    });
  } catch { box.innerHTML = errorBox("Couldn't load prices. Check your connection and try again."); }
}

// Compares each watched game's cheapest official price now with the price when it was saved
// (or the target price the visitor set) and flags drops. Runs in the browser, no account needed.
async function refreshWatchlist() {
  const w = store.get('watchlist', []);
  if (!w.length) return;
  try {
    const names = await getStoreNames();
    const data = await getJSON(CS + 'games?ids=' + w.slice(0, 25).map((g) => encodeURIComponent(g.id)).join(','));
    const hits = [];
    w.forEach((g) => {
      const entry = data[g.id]; if (!entry) return;
      const prices = (entry.deals || []).filter((d) => names[d.storeID]).map((d) => +d.price);
      if (!prices.length) return;
      const now = Math.min(...prices);
      const row = document.querySelector(`[data-wid="${CSS.escape(String(g.id))}"] .wmeta`);
      const hitTarget = g.target && now <= g.target;
      const dropped = g.price != null && now <= g.price - 0.5;
      if (row) row.innerHTML = `Now <b>${money(now)}</b>` + (g.price != null ? ` · was ${money(g.price)} when saved` : '') + (g.target ? ` · alert at ${money(g.target)}` : '')
        + (hitTarget ? ' <span class="pill pill-good">Hit your target</span>' : dropped ? ' <span class="pill pill-good">Price drop</span>' : '');
      if (hitTarget || dropped) hits.push(g.title);
    });
    const ban = document.getElementById('dropBanner');
    if (ban && hits.length) ban.innerHTML = `<div class="card verdict v-good"><span class="label">Price alert</span><h3>${hits.length === 1 ? esc(hits[0]) + ' is cheaper now' : hits.length + ' games on your watchlist are cheaper now'}</h3></div>`;
  } catch { /* offline or API busy: keep the saved-price view */ }
}

// ---------- Price tracker (every game page) ----------
function recordPrice(id, price) {
  if (!(price > 0)) return [];
  const h = store.get('ph', {}); const day = new Date().toISOString().slice(0, 10);
  const a = h[id] || []; if (a.length && a[a.length - 1][0] === day) a[a.length - 1][1] = price; else a.push([day, price]);
  h[id] = a.slice(-60);
  const keys = Object.keys(h); if (keys.length > 120) delete h[keys[0]];
  store.set('ph', h); return h[id];
}
function sparkline(pts) {
  if (pts.length < 2) return '';
  const vals = pts.map((p) => p[1]), lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const xy = vals.map((v, i) => `${(i / (vals.length - 1) * 280 + 10).toFixed(1)},${(48 - (v - lo) / span * 36).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 300 56" width="100%" height="56" role="img" aria-label="Prices you have seen for this game, from ${money(vals[0])} to ${money(vals[vals.length - 1])}"><polyline fill="none" stroke="currentColor" stroke-width="2" points="${xy}"/></svg>
    <p class="hint">Prices seen on your visits, ${money(lo)} to ${money(hi)}.</p>`;
}
function renderTracker(id, title, thumb, price, low) {
  const box = document.getElementById('trackbox'); if (!box || !(price > 0)) return;
  const pts = recordPrice(id, price);
  const wl = store.get('watchlist', []); const cur = wl.find((x) => x.id === id);
  const opts = []; if (low > 0 && low < price) opts.push([low, `Lowest ever (${money(low)})`]);
  const tenOff = Math.floor(price * 90) / 100; if (tenOff > 0 && tenOff > low) opts.push([tenOff, `10% cheaper (${money(tenOff)})`]);
  box.innerHTML = `<h2>Price tracker</h2><div class="card">
    <p>${cur ? (cur.target ? `Tracking. We flag it when it reaches ${money(cur.target)}.` : 'Tracking. Pick a price to be flagged at.') : 'Track this game and we flag it on the deals screen when the price drops.'}</p>
    <div class="row" style="flex-wrap:wrap;gap:8px">${opts.map((o, i) => `<button class="btn btn-ghost" data-t="${o[0]}">Flag me at ${esc(o[1])}</button>`).join('')}${opts.length ? '' : '<button class="btn btn-ghost" data-t="0">Track this game</button>'}</div>
    <p class="hint" id="trackMsg" aria-live="polite"></p>${sparkline(pts)}</div>`;
  box.querySelectorAll('[data-t]').forEach((b) => b.addEventListener('click', () => {
    const t = parseFloat(b.dataset.t); let w = store.get('watchlist', []); let it = w.find((x) => x.id === id);
    if (!it) { it = { id, title, thumb, price }; w.unshift(it); }
    if (t > 0) it.target = t;
    store.set('watchlist', w.slice(0, 50));
    document.getElementById('trackMsg').textContent = t > 0 ? `Saved. We flag it on the deals screen at ${money(t)}.` : 'Tracking this game.';
    const wb = document.getElementById('watchBtn'); if (wb) { wb.textContent = 'On your watchlist ✓'; wb.setAttribute('aria-pressed', 'true'); }
    const tf = document.getElementById('targetForm'); if (tf) tf.hidden = false;
    const ti = document.getElementById('targetPrice'); if (ti && t > 0) ti.value = t;
  }));
}

const gn = { players: 4, mode: 'any', budget: 20 };
async function screenGameNight() {
  view.innerHTML = `<button class="back" onclick="history.length > 1 ? history.back() : (location.hash = '#/deals')">‹ Back</button>
    <h1 class="screen-title">Game night picker</h1>
    <p class="hint">Tell us who's playing. We find games that fit your group, with the lowest official price today.</p>
    <div class="section stack">
      <label class="hint" for="gnPlayers">Players</label>
      <select id="gnPlayers" class="input">${[2,3,4,5,6,8].map((n) => `<option value="${n}" ${n === gn.players ? 'selected' : ''}>${n}${n === 8 ? ' or more' : ''}</option>`).join('')}</select>
      <label class="hint" for="gnMode">Style</label>
      <select id="gnMode" class="input">${[['any','Anything'],['co-op','Co-op (team up)'],['party','Party and couch games'],['versus','Head to head']].map((o) => `<option value="${o[0]}" ${o[0] === gn.mode ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>
      <label class="hint" for="gnBudget">Most you'd pay per game</label>
      <select id="gnBudget" class="input">${[[10,'$10'],[20,'$20'],[30,'$30'],[60,'Any price']].map((o) => `<option value="${o[0]}" ${o[0] === gn.budget ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>
    </div>
    <div class="section" id="gnResults"></div>
    <div class="foot"><p>Player counts are the usual maximums. Check the store page for exact online and local limits.</p></div>`;
  const run = async () => {
    gn.players = +document.getElementById('gnPlayers').value; gn.mode = document.getElementById('gnMode').value; gn.budget = +document.getElementById('gnBudget').value;
    const out = document.getElementById('gnResults'); out.innerHTML = `<div class="stack">${skeletons(4)}</div>`;
    const names = await getStoreNames();
    const cand = GAMENIGHT.filter((x) => gn.players >= x[2] && (gn.players <= x[3] || gn.players >= 8 && x[3] >= 8) && (gn.mode === 'any' || x[4] === gn.mode));
    // CheapShark rate-limits bursts, so look games up a few at a time.
    const found = []; let failed = 0, next = 0;
    const worker = async () => {
      while (next < cand.length) {
        const x = cand[next++];
        try {
          const d = await getJSON(CS + 'deals?pageSize=20&sortBy=Price&title=' + encodeURIComponent(x[1]));
          const m = d.filter((y) => names[y.storeID] && titleHas(y.title, x[1]) && isBase(y.title, x[1]) && +y.salePrice > 0.5).sort((p, q) => p.title.length - q.title.length || p.salePrice - q.salePrice);
          if (m.length && +m[0].salePrice <= gn.budget) found.push(Object.assign({}, m[0], { _max: x[3], _mode: x[4] }));
        } catch { failed++; }
      }
    };
    await Promise.all([worker(), worker(), worker()]);
    const rows = found;
    rows.sort((a, b) => b.savings - a.savings);
    out.innerHTML = rows.length ? `<h2>${rows.length} picks for ${gn.players} players</h2><div class="stack">${rows.map((d) => dealRow(d, names).replace('Official store', `Up to ${d._max} players · ${d._mode}`)).join('')}</div>`
      : failed > cand.length / 2 ? '<p class="empty">The price service is busy. Wait a moment and change a filter to try again.</p>' : '<p class="empty">Nothing matched right now. Try a higher budget or a different style.</p>';
  };
  ['gnPlayers', 'gnMode', 'gnBudget'].forEach((id) => document.getElementById(id).addEventListener('change', run));
  run();
}

  try {
    const items = (await webData('news=1')).filter((i) => newsFilter === 'all' || i.platform === newsFilter).slice(0, 60);
    box.innerHTML = items.length ? `<div class="stack">${items.map((i) => `
      <a class="news-item" href="${esc(i.link)}" target="_blank" rel="noopener">
        <div class="tag-row"><span class="plat p-${esc(i.platform)}">${esc(PLATFORM_NAMES[i.platform] || i.platform)}</span><span>${esc(i.source)}</span>${i.date ? `<span>· ${ago(i.date)}</span>` : ''}</div>
        <h3>${esc(i.title)}</h3></a>`).join('')}</div>` : '<p class="empty">No headlines right now.</p>';
  } catch { box.innerHTML = errorBox("Couldn't load the news. Check your connection and try again."); }

let productsCache = null;
async function getProducts() {
  if (productsCache) return productsCache;
  const { data: products, error } = await sb.from('products').select('*').order('name');
  if (error) throw error;
  const { data: offers } = await sb.from('product_offers').select('*');
  const byProduct = {};
  for (const o of offers || []) (byProduct[o.product_id] ||= []).push(o);
  productsCache = products.map((p) => ({ ...p, offers: (byProduct[p.id] || []).sort((a, b) => (a.price ?? 1e9) - (b.price ?? 1e9)) }));
  return productsCache;
}

    view.innerHTML = `<h1 class="screen-title">Gear</h1><p class="lede">Our picks for your whole setup. Tap a category to see them.</p>
      ${GEAR_GROUPS.map(([g, cats]) => `<div class="section"><h2>${esc(g)}</h2><div class="cats">${cats.map((c) => `<a class="cat" href="#/gear/${encodeURIComponent(c)}"><span class="gi gi-sm">${gIcon(c, 22)}</span>${esc(c)}<small>${count(c)} ${count(c) === 1 ? 'pick' : 'picks'}</small></a>`).join('')}</div></div>`).join('')}

let session = null;
async function refreshSession() { if (!sb) return null; const { data } = await sb.auth.getSession(); session = data.session; return session; }

  await refreshSession();
  const help = `
    <div class="section"><h2>Help and community</h2><div class="list">
      <a class="list-link" href="#/gamenight"><span>Game night picker</span><span>›</span></a>
      <a class="list-link" href="#/veterans"><span>Veteran hub</span><span>›</span></a>
      <a class="list-link" href="#/mypc"><span>My PC (for "Will it run?")</span><span>›</span></a>
      <a class="list-link" href="${SITE}/#help" target="_blank" rel="noopener"><span>Help and common questions</span><span>↗</span></a>
      <a class="list-link" href="mailto:${SUPPORT}"><span>Email us</span><span>↗</span></a>

      <a class="list-link" href="${SITE}/privacy.html" target="_blank" rel="noopener"><span>Privacy policy</span><span>↗</span></a>
      <a class="list-link" href="${SITE}/terms.html" target="_blank" rel="noopener"><span>Terms of use</span><span>↗</span></a>
    </div></div>
    <div class="foot"><p>SteelGames is a product of Lonestar PPS, LLC, a veteran-owned company.</p><p>SteelGames is not affiliated with Valve, Epic Games, Microsoft, Sony or Nintendo.</p></div>`;
  if (!session) { renderAuth(help); return; }
  view.innerHTML = `<h1 class="screen-title">Account</h1><div class="section stack" id="acct"><div class="skel"></div></div>${help}`;
  let profile = null, points = null;
  try { profile = (await sb.rpc('my_profile')).data; } catch {}
  try { points = (await sb.rpc('my_points')).data; } catch {}
  if (profile && !profile.accepted_terms_at && store.get('termsPending', false)) { try { await sb.rpc('accept_terms'); store.set('termsPending', false); } catch {} }
  document.getElementById('acct').innerHTML = `
    <div class="card"><h3>${esc(profile?.username || 'Your account')}${profile?.is_veteran ? ' <span class="vet" style="margin-left:6px">Veteran</span>' : ''}</h3><p>${esc(session.user.email || '')}</p></div>
    <div class="card"><span class="hint">Steel Points</span><h3 style="font-size:28px">${(points?.balance ?? 0).toLocaleString()}</h3><p>Earn points when you shop through SteelGames at eligible stores, and trade them for gift cards in the iPhone app.</p></div>
    <button class="btn btn-ghost btn-block" id="signOut">Sign out</button>
    <button class="btn btn-danger btn-block" id="deleteBtn">Delete my account</button>
    <p class="hint">Deleting your account permanently removes your profile, reviews, messages, receipts and Steel Points. This can't be undone.</p>
    <div id="acctMsg" role="status"></div>`;
  document.getElementById('signOut').addEventListener('click', async () => { await sb.auth.signOut(); session = null; screenAccount(); });
  document.getElementById('deleteBtn').addEventListener('click', () => confirmDelete());
}

function confirmDelete() {
  const box = document.getElementById('acctMsg');
  box.innerHTML = `<div class="card verdict v-bad"><h3>Delete your account for good?</h3><p>Type DELETE to confirm.</p>
    <input class="input" id="delConfirm" autocomplete="off" aria-label="Type DELETE to confirm">
    <div class="row"><button class="btn btn-danger" id="delGo">Delete account</button><button class="btn btn-ghost" id="delCancel">Cancel</button></div></div>`;
  document.getElementById('delCancel').addEventListener('click', () => { box.innerHTML = ''; });
  document.getElementById('delGo').addEventListener('click', async (e) => {
    if (document.getElementById('delConfirm').value.trim().toUpperCase() !== 'DELETE') { document.getElementById('delConfirm').focus(); return; }
    e.currentTarget.disabled = true; e.currentTarget.textContent = 'Deleting…';
    try {
      const r = await fetch(SUPABASE_URL + '/functions/v1/delete-account', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + session.access_token } });
      if (!r.ok) throw new Error();
      await sb.auth.signOut(); session = null;
      view.innerHTML = `<div class="section"><div class="msg ok">Your account has been deleted.</div><a class="btn btn-ghost" href="#/deals">Back to deals</a></div>`;
    } catch { box.innerHTML = errorBox(`Couldn't delete your account. Check your connection and try again, or email ${SUPPORT}.`); }
  });
}

let authMode = 'signin';
function renderAuth(help) {
  view.innerHTML = `<h1 class="screen-title">Account</h1>
    <p class="lede">You can browse prices, news and gear without an account. A free account lets you earn Steel Points.</p>
    <div class="section">
      <div class="seg" role="group" aria-label="Sign in or create an account">
        <button type="button" data-m="signin" aria-pressed="${authMode === 'signin'}">Sign in</button>
        <button type="button" data-m="create" aria-pressed="${authMode === 'create'}">Create account</button>
      </div>
      <form class="stack" id="authForm" novalidate>
        <label class="field">Email<input class="input" type="email" id="email" autocomplete="email" required></label>
        <label class="field">Password (8 or more characters)<input class="input" type="password" id="pw" autocomplete="${authMode === 'create' ? 'new-password' : 'current-password'}" minlength="8" required></label>
        ${authMode === 'create' ? `
          <label class="field">Username (shown publicly)<input class="input" id="un" autocomplete="username" pattern="[A-Za-z0-9_]{3,20}" required></label>
          <p class="hint">3 to 20 letters, numbers or underscores.</p>
          <label class="check"><input type="checkbox" id="agree"><span>I agree to the <a href="${SITE}/terms.html" target="_blank" rel="noopener">Terms of Use</a> and community rules. SteelGames has zero tolerance for abusive or objectionable content.</span></label>` : ''}
        <button class="btn btn-primary btn-block" type="submit" id="authGo">${authMode === 'create' ? 'Create account' : 'Sign in'}</button>
        ${authMode === 'signin' ? '<button class="btn btn-ghost btn-block" type="button" id="forgot">Forgot password?</button>' : ''}
        <div id="authMsg" role="status"></div>
      </form>
    </div>${help}`;
  view.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => { authMode = b.dataset.m; renderAuth(help); }));
  const msg = (html) => { document.getElementById('authMsg').innerHTML = html; };
  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim(), pw = document.getElementById('pw').value;
    if (!email.includes('@')) return msg(errorBox('Enter a valid email address.'));
    if (pw.length < 8) return msg(errorBox('Your password needs at least 8 characters.'));
    const go = document.getElementById('authGo'); go.disabled = true;
    try {
      if (authMode === 'create') {
        const un = document.getElementById('un').value.trim();
        if (!/^[A-Za-z0-9_]{3,20}$/.test(un)) { go.disabled = false; return msg(errorBox('Usernames use 3 to 20 letters, numbers or underscores.')); }
        if (!document.getElementById('agree').checked) { go.disabled = false; return msg(errorBox('Please agree to the Terms of Use to continue.')); }
        const { data, error } = await sb.auth.signUp({ email, password: pw, options: { data: { username: un }, emailRedirectTo: SITE + '/app/#/account' } });
        if (error) throw error;
        store.set('termsPending', true);
        if (data.session) { await sb.rpc('accept_terms'); store.set('termsPending', false); screenAccount(); }
        else msg('<div class="msg ok">Check your email and tap the link to finish creating your account.</div>');
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password: pw });
        if (error) throw error;
        screenAccount();
      }
    } catch (err) { msg(errorBox(err?.message || 'Something went wrong. Try again.')); }
    finally { if (document.getElementById('authGo')) document.getElementById('authGo').disabled = false; }
  });
  const forgot = document.getElementById('forgot');
  if (forgot) forgot.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    if (!email.includes('@')) return msg(errorBox('Type your email above first.'));
    await sb.auth.resetPasswordForEmail(email, { redirectTo: SITE + '/app/#/account' });
    msg('<div class="msg ok">If that email has an account, we sent a link to reset your password.</div>');
  });
}

// ---------- Router ----------
async function route() {
  const parts = (location.hash.replace(/^#\/?/, '') || 'deals').split('/').map(decodeURIComponent);
  const [page, arg] = parts;
  const tab = { deals: 'deals', game: 'deals', news: 'news', gear: 'gear', account: 'account', mypc: 'account', gamenight: 'deals', veterans: 'deals' }[page] || 'deals';
  document.querySelectorAll('.tabbar a').forEach((a) => { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  document.title = 'SteelGames · Game Deals';
  window.scrollTo(0, 0);
  if (page === 'game' && arg) await screenGame(arg);
  else if (page === 'news') await screenNews();
  else if (page === 'gear') await screenGear(arg);
  else if (page === 'account') await screenAccount();
  else if (page === 'mypc') await screenMyPC();
  else if (page === 'gamenight') await screenGameNight();
  else if (page === 'veterans') await screenVeterans();
  else await screenDeals();
  view.focus({ preventScroll: true });
}
window.addEventListener('hashchange', route);
if (sb) sb.auth.onAuthStateChange((_e, s) => { session = s; });
route();

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
