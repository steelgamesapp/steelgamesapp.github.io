<style>
/* Layout: app shell. Sticky top bar with the brand, one scrolling screen per tab, and a fixed bottom tab bar (Deals, News, Gear, Account). Game and product pages slide in as their own screens with a Back button. */
:root {
  --bg: #0C0E11; --surface: #15181D; --raised: #1C2027; --line: #262C35; --line-strong: #2E3540;
  --fg: #EDEFF2; --muted: #9BA4AF; --steel: #C3CBD5;
  --accent: #FF7A1A; --accent-soft: #FF9A4D; --accent-ink: #1A0E04;
  --good: #5CCB72; --good-bg: #0F1D14; --good-line: #244A30;
  --warn: #F5B544; --warn-bg: #221A0B; --warn-line: #5A4416;
  --bad: #FF6B74; --bad-bg: #231114; --bad-line: #5A262C;
  --info: #8FB4E3; --info-bg: #121A26; --info-line: #2B3D57;
  --resale: #C4B5FD;
  --display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --body: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --tabbar: 68px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.5; }
body { min-height: 100dvh; padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px)); }
a { color: var(--accent-soft); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left, 0px)) 0 max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.topbar { position: sticky; top: 0; z-index: 20; background: rgba(12,14,17,0.94); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
@supports (backdrop-filter: blur(8px)) { .topbar { background: rgba(12,14,17,0.82); backdrop-filter: blur(10px); } }
.topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--fg); }
.brand span { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: 2.4px; }
.vet { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 7px; border-radius: 999px; background: var(--info-bg); border: 1px solid var(--info-line); color: #CFE0F5; font-size: 13px; font-weight: 600; white-space: nowrap; }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px 0 6px; border: 0; border-radius: 10px; background: none; color: var(--accent-soft); font-weight: 600; cursor: pointer; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #111418; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar nav { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar); }
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 600; }
.tabbar a[aria-current="page"] { color: var(--accent); }

/* Screens */
main { padding: 16px 0 28px; }
main:focus { outline: none; }
.screen-title { font-size: 28px; font-weight: 700; margin: 6px 0 4px; }
.lede { color: var(--steel); font-size: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.section { margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }
.section h2 { font-size: 20px; }
.hint { color: var(--muted); font-size: 14px; }

/* Search and chips */
.search { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-strong); margin-top: 14px; }
.search input { flex: 1; min-width: 0; height: 50px; border: 0; background: none; color: var(--fg); font: inherit; font-size: 17px; outline: none; }
.search input::placeholder { color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; margin-top: 12px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--steel); font-size: 15px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* Deal rows */
.deal { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--fg); min-height: 76px; }
.deal:active { background: var(--raised); }
.thumb { width: 96px; height: 45px; flex-shrink: 0; border-radius: 8px; object-fit: cover; background: var(--raised); }
.deal-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.deal-title { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deal-meta { font-size: 13px; color: var(--muted); }
.price { font-weight: 700; font-variant-numeric: tabular-nums; }
.was { color: var(--muted); text-decoration: line-through; font-size: 13px; margin-left: 6px; font-weight: 400; }
.off { flex-shrink: 0; padding: 5px 8px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }

.card { padding: 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-size: 19px; }
.card p { color: var(--steel); font-size: 16px; }
.verdict { border-width: 2px; }
.verdict .label { font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.v-good { background: var(--good-bg); border-color: var(--good-line); } .v-good .label, .v-good h3 { color: var(--good); }
.v-warn { background: var(--warn-bg); border-color: var(--warn-line); } .v-warn .label, .v-warn h3 { color: var(--warn); }
.v-bad { background: var(--bad-bg); border-color: var(--bad-line); } .v-bad .label, .v-bad h3 { color: var(--bad); }
.v-info { background: var(--info-bg); border-color: var(--info-line); } .v-info .label, .v-info h3 { color: var(--info); }
.card ul { margin: 0; padding-left: 20px; color: var(--steel); font-size: 15px; display: flex; flex-direction: column; gap: 4px; }

/* Game header */
.hero-img { width: 100%; aspect-ratio: 460 / 215; object-fit: cover; border-radius: 16px; background: var(--raised); display: block; }
.game-title { font-size: 26px; margin-top: 14px; }
.big-price { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.big-price .price { font-family: var(--display); font-size: 32px; }

/* Store rows */
.store { display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.store.best { border: 2px solid var(--accent); }
.store-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.store-name { font-weight: 700; }
.earn { font-size: 13px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent; font-weight: 700; font-size: 16px; text-decoration: none; cursor: pointer; white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: var(--raised); color: var(--fg); border-color: var(--line-strong); }
.btn-danger { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-line); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: 0.5; cursor: default; }

/* News */
.news-item { display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--fg); }
.news-item h3 { font-family: var(--body); font-size: 17px; font-weight: 600; line-height: 1.35; }
.tag-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.plat { padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; border: 1px solid; }
.p-pc { color: #FF8A3D; background: #1E150E; border-color: #4A2E16; }
.p-xbox { color: #5CCB72; background: #0F1D14; border-color: #244A30; }
.p-playstation { color: #6FA0FF; background: #0E1526; border-color: #243C68; }

/* Gear */
.cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cat { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 64px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-weight: 600; font-size: 16px; }
.cat small { color: var(--muted); font-weight: 500; font-size: 13px; }
.product { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.product h3 { font-family: var(--body); font-size: 17px; font-weight: 700; }
.product p { color: var(--steel); font-size: 15px; }

/* Forms */
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600; color: var(--steel); }
.input, select.input { min-height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); font: inherit; font-size: 17px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; color: var(--steel); }
.check input { width: 24px; height: 24px; margin-top: 2px; accent-color: var(--accent); flex-shrink: 0; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.seg button { min-height: 44px; border: 0; border-radius: 10px; background: none; font-weight: 600; color: var(--steel); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--fg); }
.list-link { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 16px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; font-weight: 500; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; cursor: pointer; }
.list-link:last-child { border-bottom: 0; }
.list { border-radius: 16px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.list-link span:last-child { color: var(--muted); }
.msg { padding: 12px 14px; border-radius: 12px; font-size: 15px; }
.msg.err { background: var(--bad-bg); border: 1px solid var(--bad-line); color: #FFC2C6; }
.msg.ok { background: var(--good-bg); border: 1px solid var(--good-line); color: #BDEBC7; }
.foot { margin-top: 28px; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 8px; }

/* Loading */
.skel { height: 76px; border-radius: 16px; background: linear-gradient(90deg, var(--surface), var(--raised), var(--surface)); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>

  const mRec = meets(rec), mMin = meets(min);
  if (min.gpuScore != null && gpu.score < min.gpuScore) { details.push(`Graphics: needs at least ${min.gpus.map((g) => g.name).join(' or ')}. You have ${gpu.name}.`); upgrades.push('Graphics cards'); }
  if (min.ram != null && pc.ram < min.ram) { details.push(`Memory: needs ${min.ram} GB. You have ${pc.ram} GB.`); upgrades.push('Memory'); }
  const space = rec.storage ?? min.storage;
  if (space != null && pc.storage < space) { details.push(`Storage: needs ${space} GB free. You have ${pc.storage} GB.`); upgrades.push('Storage'); }
  if (!min.gpus.length && !rec.gpus.length) details.push("We couldn't match the graphics card this game lists, so only memory was checked.");
  details.push("Processor isn't checked. Compare it with the requirements below.");
  let level, headline;
  if (mRec === true && !upgrades.includes('Storage')) { level = 'good'; headline = 'Runs great on your PC'; }
  else if (mMin === true || (mMin == null && mRec === true)) {
    level = 'good'; headline = upgrades.length ? 'Should run, but check storage' : 'Should run on your PC';
    if (rec.gpuScore != null && gpu.score < rec.gpuScore && !upgrades.includes('Graphics cards')) { details.unshift('Expect lower settings. Your graphics card is below the recommended one.'); upgrades.push('Graphics cards'); level = 'warn'; }
  } else if (mMin === false) { level = 'bad'; headline = "Below this game's minimum"; }
  else { level = 'info'; headline = "Can't tell from this listing"; }
  return { level, headline, details, upgrades };
}
function buyOrWait(current, regular, low) {
  const off = pct(current, regular);
  if (!(low > 0)) return off >= 50 ? { level: 'good', label: 'Good deal', detail: `${off}% off right now. We don't have its price history yet.` }
                                   : { level: 'warn', label: 'Consider waiting', detail: "We don't have its price history yet. Add it to your watchlist so you can check back." };
  if (current <= low * 1.05) return { level: 'good', label: 'Buy now', detail: current <= low ? "This is the lowest price it's ever been." : `Within 5% of its lowest price ever (${money(low)}).` };
  if (off >= 40 && current <= low * 1.35) return { level: 'good', label: 'Good deal', detail: `${off}% off. It has been ${money(low)} before, so waiting could save ${money(current - low)}.` };
  return { level: 'warn', label: 'Wait for a better price', detail: `It has been as low as ${money(low)}. Add it to your watchlist and check back.` };
}

function renderAuth(help) {
  view.innerHTML = `<h1 class="screen-title">Account</h1>
    <p class="lede">You can browse prices, news and gear without an account. A free account lets you earn Steel Points.</p>
    <div class="section">
      <div class="seg" role="group" aria-label="Sign in or create an account">
        <button type="button" data-m="signin" aria-pressed="${authMode === 'signin'}">Sign in</button>
        <button type="button" data-m="create" aria-pressed="${authMode === 'create'}">Create account</button>
      </div>
      <form class="stack" id="authForm" novalidate>
        <label class="field">Email<input class="input" type="email" id="email" autocomplete="email" required></label>
        <label class="field">Password (8 or more characters)<input class="input" type="password" id="pw" autocomplete="${authMode === 'create' ? 'new-password' : 'current-password'}" minlength="8" required></label>
        ${authMode === 'create' ? `
          <label class="field">Username (shown publicly)<input class="input" id="un" autocomplete="username" pattern="[A-Za-z0-9_]{3,20}" required></label>
          <p class="hint">3 to 20 letters, numbers or underscores.</p>
          <label class="check"><input type="checkbox" id="agree"><span>I agree to the <a href="${SITE}/terms.html" target="_blank" rel="noopener">Terms of Use</a> and community rules. Steel Games has zero tolerance for abusive or objectionable content.</span></label>` : ''}
        <button class="btn btn-primary btn-block" type="submit" id="authGo">${authMode === 'create' ? 'Create account' : 'Sign in'}</button>
        ${authMode === 'signin' ? '<button class="btn btn-ghost btn-block" type="button" id="forgot">Forgot password?</button>' : ''}
        <div id="authMsg" role="status"></div>
      </form>
    </div>${help}`;
  view.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => { authMode = b.dataset.m; renderAuth(help); }));
  const msg = (html) => { document.getElementById('authMsg').innerHTML = html; };
  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim(), pw = document.getElementById('pw').value;
    if (!email.includes('@')) return msg(errorBox('Enter a valid email address.'));
    if (pw.length < 8) return msg(errorBox('Your password needs at least 8 characters.'));
    const go = document.getElementById('authGo'); go.disabled = true;
    try {
      if (authMode === 'create') {
        const un = document.getElementById('un').value.trim();
        if (!/^[A-Za-z0-9_]{3,20}$/.test(un)) { go.disabled = false; return msg(errorBox('Usernames use 3 to 20 letters, numbers or underscores.')); }
        if (!document.getElementById('agree').checked) { go.disabled = false; return msg(errorBox('Please agree to the Terms of Use to continue.')); }
        const { data, error } = await sb.auth.signUp({ email, password: pw, options: { data: { username: un }, emailRedirectTo: SITE + '/app/#/account' } });
        if (error) throw error;
        store.set('termsPending', true);
        if (data.session) { await sb.rpc('accept_terms'); store.set('termsPending', false); screenAccount(); }
        else msg('<div class="msg ok">Check your email and tap the link to finish creating your account.</div>');
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password: pw });
        if (error) throw error;
        screenAccount();
      }
    } catch (err) { msg(errorBox(err?.message || 'Something went wrong. Try again.')); }
    finally { if (document.getElementById('authGo')) document.getElementById('authGo').disabled = false; }
  });
  const forgot = document.getElementById('forgot');
  if (forgot) forgot.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    if (!email.includes('@')) return msg(errorBox('Type your email above first.'));
    await sb.auth.resetPasswordForEmail(email, { redirectTo: SITE + '/app/#/account' });
    msg('<div class="msg ok">If that email has an account, we sent a link to reset your password.</div>');
  });
}

// ---------- Router ----------
async function route() {
  const parts = (location.hash.replace(/^#\/?/, '') || 'deals').split('/').map(decodeURIComponent);
  const [page, arg] = parts;
  const tab = { deals: 'deals', game: 'deals', news: 'news', gear: 'gear', account: 'account', mypc: 'account' }[page] || 'deals';
  document.querySelectorAll('.tabbar a').forEach((a) => { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  document.title = 'Steel Games · Game Deals';
  window.scrollTo(0, 0);
  if (page === 'game' && arg) await screenGame(arg);
  else if (page === 'news') await screenNews();
  else if (page === 'gear') await screenGear(arg);
  else if (page === 'account') await screenAccount();
  else if (page === 'mypc') await screenMyPC();
  else await screenDeals();
  view.focus({ preventScroll: true });
}
window.addEventListener('hashchange', route);
if (sb) sb.auth.onAuthStateChange((_e, s) => { session = s; });
route();

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
