<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SteelGames Deals Widget</title>
<style>
:root{--bg:#0C0E11;--card:#14171C;--line:#262C35;--fg:#EDEFF2;--muted:#9BA4AF;--accent:#FF7A1A;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
.w{padding:12px;display:flex;flex-direction:column;gap:8px}
h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 2px;display:flex;justify-content:space-between;gap:8px}
h1 span{color:var(--accent)}
a{color:inherit;text-decoration:none}
.r{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.r img{width:84px;height:40px;object-fit:cover;border-radius:6px;background:#222;flex:none}
.t{flex:1;min-width:0}.t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t small{color:var(--muted)}.p{font-weight:700}
.o{background:var(--accent);color:#140C04;font-weight:700;border-radius:8px;padding:3px 7px;font-size:13px}
.f{font-size:12px;color:var(--muted);text-align:center;padding-top:2px}
</style><meta name="google-adsense-account" content="ca-pub-3613204296597380">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3613204296597380" crossorigin="anonymous"></script>
</head><body>
<div class="w"><h1><span>SteelGames</span><span style="color:var(--muted)">Top PC deals</span></h1><div id="l" style="display:flex;flex-direction:column;gap:8px"></div>
<div class="f"><a href="https://steelgamesapp.com/app/" target="_blank" rel="noopener">See all deals on SteelGames ›</a> · Veteran-owned</div></div>
<script>
const NAMES={'1':'Steam','25':'Epic','3':'Green Man Gaming','7':'GOG','11':'Humble','15':'Fanatical'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('https://www.cheapshark.com/api/1.0/deals?storeID=1,25,3,7,11,15&onSale=1&sortBy=Deal%20Rating&pageSize=12&AAA=0').then(r=>r.json()).then(d=>{
 const seen=new Set();const rows=d.filter(x=>!seen.has(x.gameID)&&seen.add(x.gameID)).slice(0,5);
 document.getElementById('l').innerHTML=rows.map(x=>`<a class="r" target="_blank" rel="noopener" href="https://steelgamesapp.com/app/#/game/${encodeURIComponent(x.gameID)}"><img src="${esc(x.thumb)}" alt="" loading="lazy"><span class="t"><b>${esc(x.title)}</b><small>${esc(NAMES[x.storeID]||'Store')}</small></span><span class="p">$${(+x.salePrice).toFixed(2)}</span><span class="o">-${Math.round(+x.savings)}%</span></a>`).join('')||'<p class="f">No deals right now.</p>';
}).catch(()=>{document.getElementById('l').innerHTML='<p class="f">Deals unavailable. Try again soon.</p>'});
</script></body></html>
