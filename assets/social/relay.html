<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>relay</title>
<p id="s">Sending…</p>
<script>
(async () => {
  const f = new URLSearchParams(location.search).get('f') || '';
  if (!/^[\w.\-\/]+$/.test(f) || f.includes('..')) { s.textContent = 'bad file'; return; }
  const r = await fetch('/' + f); const b = await r.arrayBuffer();
  const msg = { sgRelay: true, name: f.split('/').pop(), type: r.headers.get('content-type'), buf: b };
  (window.opener || window.parent).postMessage(msg, '*', [b]);
  s.textContent = 'Sent ' + msg.name + ' (' + b.byteLength + ' bytes). You can close this tab.';
})();
</script>
