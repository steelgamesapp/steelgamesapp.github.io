name: Restore blank game pages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore pages from history
        run: |
          python3 - <<'PY'
          import os, subprocess
          def sh(*a):
              return subprocess.run(a, capture_output=True, text=True).stdout
          n = 0
          for d in sorted(os.listdir("game")):
              p = f"game/{d}/index.html"
              if os.path.isfile(p) and os.path.getsize(p) == 0:
                  for r in sh("git", "log", "--format=%H", "--", p).split():
                      s = sh("git", "cat-file", "-s", f"{r}:{p}").strip()
                      if s.isdigit() and int(s) > 1000:
                          data = subprocess.run(["git", "show", f"{r}:{p}"], capture_output=True).stdout
                          open(p, "wb").write(data)
                          n += 1
                          break
          print("restored", n)
          PY
      - name: Commit and push
        run: |
          git config user.name "SteelGames Bot"
          git config user.email "steelgames.app@outlook.com"
          git add -A game
          git diff --cached --quiet || git commit -m "Restore game pages that were blanked by a build bug"
          git pull --rebase -X theirs origin main
          git push
