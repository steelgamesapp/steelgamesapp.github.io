name: Black Friday announcement (one time)
on:
  push:
    branches: [main]
    paths: ["tools/announce_bf.py"]
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 tools/announce_bf.py
