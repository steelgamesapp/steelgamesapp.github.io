name: Build SEO deal pages
on:
  schedule:
    - cron: "17 11 * * *"
    - cron: "43 5 * * *"
    - cron: "26 17 * * *"
  workflow_dispatch:
permissions:
  contents: write
# One build at a time: overlapping runs were hammering the price API and getting rate limited.
concurrency:
  group: seo-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_seo.py
      - name: Rebuild the holiday gift shop from gear.html
        run: python3 tools/gifts_page.py || echo "Gift shop page skipped"
      - name: Commit changes
        run: |
          git config user.name "SteelGames Bot"
          git config user.email "steelgames.app@outlook.com"
          git add -A deal deals gifts game data pros media-kit tools/game_ids.json tools/popular_map.json sitemap.xml robots.txt games.html keys.html military.html wishlist.html cart.html collection.html sync.html
          git diff --cached --quiet && { echo "Nothing changed, nothing to push."; exit 0; }
          git commit -m "Daily deal pages update"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Could not push after 3 tries" >&2
          exit 1
