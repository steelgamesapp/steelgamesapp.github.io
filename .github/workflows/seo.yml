name: Build SEO deal pages
on:
  schedule:
    - cron: "17 11 * * *"
    - cron: "43 5 * * *"
    - cron: "26 17 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_seo.py
      - name: Commit changes
        run: |
          git config user.name "SteelGames Bot"
          git config user.email "steelgames.app@outlook.com"
          git add -A deal deals game data tools/game_ids.json sitemap.xml robots.txt games.html keys.html military.html wishlist.html cart.html collection.html sync.html
          git diff --cached --quiet || git commit -m "Daily deal pages update"
          git pull --rebase -X theirs origin main || (git rebase --abort; git pull --no-rebase -X ours origin main)
          git push
