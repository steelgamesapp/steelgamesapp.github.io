name: Update gift card prices
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh prices
        env:
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
        run: python3 scripts/update_prices.py
      - name: Commit changes
        run: |
          if git diff --quiet; then echo "No price changes"; exit 0; fi
          git config user.name "SteelGames price bot"
          git config user.email "actions@users.noreply.github.com"
          git add gift-cards/index.html
          git commit -m "Update gift card prices"
          git push
