name: Kinguin key buttons on game pages
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Only print what the feed returns for this search (no changes)"
        required: false
        default: ""
permissions:
  contents: write
# Shares the deal-page build's lock so the two never push game pages at the same time.
concurrency:
  group: seo-build
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Match game pages to Kinguin keys and refresh prices
        env:
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
          PROBE: ${{ github.event.inputs.probe }}
        run: |
          if [ -n "$PROBE" ]; then python3 tools/kinguin_keys.py --probe "$PROBE"; exit 0; fi
          python3 tools/kinguin_keys.py
      - name: Commit changes
        if: ${{ github.event.inputs.probe == '' }}
        run: |
          git config user.name "SteelGames Bot"
          git config user.email "steelgames.app@outlook.com"
          git add data/kinguin_keys.json game
          git diff --cached --quiet && { echo "Nothing changed."; exit 0; }
          git commit -m "Kinguin key buttons: matches and prices"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Could not push after 3 tries" >&2
          exit 1
